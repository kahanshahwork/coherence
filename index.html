<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coherence Tech</title>
<meta name="description" content="Coherence Tech. AI and beyond.">
<meta name="theme-color" content="#05070a">
<meta property="og:title" content="Coherence Tech">
<meta property="og:description" content="AI and beyond. Technology that clears the way for business.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e6bd6b' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23fff1cf'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main class="board">
  <div class="mark" id="mark">
    <canvas id="ring" aria-hidden="true"></canvas>
    <p class="inf" aria-hidden="true">into the infinite</p>
  </div>

  <h1 class="name" aria-label="Coherence Tech">
    <span class="co" aria-hidden="true"><b class="L" style="--i:0"><i>C</i></b><b class="L" style="--i:1"><i>o</i></b><b class="L" style="--i:2"><i>h</i></b><b class="L" style="--i:3"><i>e</i></b><b class="L" style="--i:4"><i>r</i></b><b class="L" style="--i:5"><i>e</i></b><b class="L" style="--i:6"><i>n</i></b><b class="L" style="--i:7"><i>c</i></b><b class="L" style="--i:8"><i>e</i></b></span>
    <span class="tech" aria-hidden="true"><b class="L" style="--i:10"><i>T</i></b><b class="L e" style="--i:11"><i>E</i></b><b class="L" style="--i:12"><i>C</i></b><b class="L" style="--i:13"><i>H</i></b></span>
  </h1>

  <nav class="links" aria-label="Links">
    <button class="link" id="openFilm" type="button">
      <span>Watch the film</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <button class="link" id="openDeck" type="button">
      <span>Product deck</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6zM14 3.5v4h4M9 12h6M9 15.5h6"/></svg>
    </button>
    <a class="link" href="https://www.paraiq.site" target="_blank" rel="noopener">
      <span>ParaIQ</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>
    <button class="link" id="openMail" type="button">
      <span>Connect with us</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
    </button>
  </nav>
</main>

<!-- Film overlay -->
<div class="ov" id="ovFilm" role="dialog" aria-modal="true" aria-label="Film" hidden>
  <button class="x" type="button" data-close aria-label="Close">&#10005;</button>
  <div class="film-frame">
    <video id="film" controls playsinline preload="none" poster="assets/video/poster.jpg" src="assets/video/coherence-film.mp4">Your browser can't play this video.</video>
  </div>
</div>

<!-- Deck overlay -->
<div class="ov" id="ovDeck" role="dialog" aria-modal="true" aria-label="Product deck" hidden>
  <button class="x" type="button" data-close aria-label="Close">&#10005;</button>
  <div class="deck-frame" id="deckFrame" tabindex="0" role="group" aria-roledescription="carousel" aria-label="ParaIQ product deck slides">
    <div class="deck-img">
      <img id="slide" alt="ParaIQ product deck, slide 1 of 18" width="1467" height="825">
      <button class="nav prev" id="prev" type="button" aria-label="Previous slide">&#8592;</button>
      <button class="nav next" id="next" type="button" aria-label="Next slide">&#8594;</button>
    </div>
    <div class="deck-bar">
      <span class="count" id="count" aria-live="polite">1 / 18</span>
      <a class="pill small" href="assets/deck/ParaIQ-Product-Deck.pdf" download>Download PDF</a>
    </div>
  </div>
</div>

<!-- Connect overlay -->
<div class="ov" id="ovMail" role="dialog" aria-modal="true" aria-label="Connect with us" hidden>
  <button class="x" type="button" data-close aria-label="Close">&#10005;</button>
  <div class="sheet">
    <p class="addr" id="addr">paraiq.app@gmail.com</p>
    <div class="row">
      <a class="pill solid" href="mailto:paraiq.app@gmail.com?subject=Connecting%20with%20Coherence%20Tech">Email us</a>
      <button class="pill" id="copy" type="button">Copy</button>
    </div>
  </div>
</div>

<script src="assets/js/main.js" defer></script>
</body>
</html>
